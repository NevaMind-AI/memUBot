name: Sync with Upstream

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
      
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/agent0ai/agent-zero.git || true
          git fetch upstream
      
      - name: Sync with upstream
        run: |
          git checkout main
          git merge upstream/main --no-edit || git merge upstream/main --no-ff --no-edit
          git push origin main
      
      - name: Report status
        if: always()
        run: |
          echo "Sync completed at $(date)"
          git log --oneline -5
      
      - name: Send notification
        if: always()
        run: |
          SYNC_STATUS="${{ job.status }}"
          SYNC_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          COMMIT_COUNT=$(git log --oneline upstream/main..HEAD | wc -l)
          
          echo "Sync Status: $SYNC_STATUS"
          echo "Sync Time: $SYNC_TIME"
          echo "Commits Synced: $COMMIT_COUNT"
          
          # Send webhook notification (Discord/Slack/Custom)
          if [ -n "${{ secrets.SYNC_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"🔄 2501-Bot Sync: $SYNC_STATUS at $SYNC_TIME ($COMMIT_COUNT commits)\"}" \
              ${{ secrets.SYNC_WEBHOOK_URL }} || true
          fi
