name: Nevamind Automatic Checks

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  nevamind-automatic-checks:
    name: nevamind automatic checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and run Node checks
        run: |
          set -euo pipefail
          while IFS= read -r package_file; do
            project_dir="$(dirname "$package_file")"
            cd "$project_dir"
            if [[ -f package-lock.json ]]; then npm ci; elif [[ -f pnpm-lock.yaml ]]; then corepack enable; pnpm install --frozen-lockfile; elif [[ -f yarn.lock ]]; then corepack enable; yarn install --immutable; else npm install; fi
            npm run test --if-present
            npm run build --if-present
            cd - >/dev/null
          done < <(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' -print)
      - name: Initial edition notice
        run: |
          echo "Automatic Add Initial Edition. Please update the check according to Biz/Tech needs." >> "$GITHUB_STEP_SUMMARY"
          # Automatic Add Initial Edition. Please update the check according to Biz/Tech needs.